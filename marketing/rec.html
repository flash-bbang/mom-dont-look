<!doctype html><html lang=ko><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>엄마 몰래 폰겜</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: HUD on top; one canvas with the watcher's room above and you on the sofa below; overlays centred. */
:root{--ink:#1c1614;--cream:#fffaf0;--butter:#ffd64a;--red:#e0453a;--muted:#4b4360;--kr:"Noto Sans CJK KR Black",system-ui,sans-serif;--px:"Noto Sans CJK KR Black","Courier New",monospace;color-scheme:light}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:#f3e6d6;color:var(--ink);font-family:var(--kr);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;word-break:keep-all;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:4px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.hl{display:flex;flex-direction:column;line-height:1.15}
.hl small{font-family:var(--px);font-size:8px;color:#6b5a48}
#lives{font-size:17px;letter-spacing:1px;white-space:nowrap}
#score{font-family:var(--px);font-size:clamp(18px,6vw,26px);text-shadow:3px 3px 0 #fff}
.ibtn{width:38px;height:38px;border-radius:12px;border:3px solid var(--ink);background:var(--cream);color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--ink);padding:0}
.ibtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ibtn .slash{display:none}.ibtn[aria-pressed="true"] .slash{display:inline}.ibtn[aria-pressed="true"] .wave{display:none}
#stage{position:relative;flex:1;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(40,30,50,.5);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box}
.overlay.mock{background:rgba(120,24,20,.6)}
.card{width:min(360px,100%);max-height:100%;overflow:auto;background:var(--cream);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:18px 16px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:9px;text-align:center}
.card>*{flex-shrink:0}
.logo{font-family:var(--px);font-size:21px;line-height:1.45;margin:0;font-weight:400}
.logo span{color:var(--red)}
.sub{font-size:18px;color:var(--muted);margin:0;line-height:1.4;text-wrap:balance}
.sub b{font-weight:400;color:var(--red)}
.face{width:140px;height:140px}
.kicker{font-family:var(--px);font-size:10px;color:var(--muted);margin:0;letter-spacing:.05em}
.aname{font-size:32px;margin:0}
.say{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:19px;line-height:1.3}
.nick{display:flex;align-items:center;gap:8px;width:100%;background:#f6eee4;border:3px solid var(--ink);border-radius:999px;padding:4px 5px 4px 14px;box-sizing:border-box}
.nick.warn{border-color:var(--red);animation:shake .4s}
.nick label{font-size:17px;white-space:nowrap}
.nick input{flex:1;min-width:0;font-family:var(--kr);font-size:19px;border:0;background:#fff;border-radius:999px;padding:8px 12px;outline:none;color:var(--ink)}
.nickwarn{font-size:17px;color:#c9322a}.nickwarn:empty{display:none}
.btn{font-family:var(--kr);font-size:22px;border:3px solid var(--ink);border-radius:14px;background:var(--butter);color:var(--ink);padding:10px 22px;cursor:pointer;box-shadow:0 4px 0 var(--ink);min-width:150px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:#fff;font-size:18px;padding:8px 16px;min-width:0}
.btn:focus-visible,.ibtn:focus-visible{outline:3px solid #7a5cc9;outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mockbig{font-size:29px;line-height:1.2;margin:0;color:var(--red);text-wrap:balance}
.big{font-family:var(--px);font-size:24px}
.stats{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.stats div{display:flex;flex-direction:column;gap:2px}.stats b{font-family:var(--px);font-size:12px;font-weight:400}.stats span{font-size:15px;color:var(--muted)}
.newbest{color:#c9783f;font-size:20px}.myrank{font-size:18px;min-height:20px}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes wobble{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.mock .mockbig{animation:wobble .5s infinite}
.rank-card{width:min(380px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--cream);border:4px solid var(--ink);border-radius:20px;box-shadow:0 6px 0 var(--ink);padding:16px 16px 10px;box-sizing:border-box;overflow:hidden}
.rank-head{display:flex;align-items:center;justify-content:space-between}.rank-head h2{margin:0;font-weight:400;font-size:26px}
.rank-note{margin:6px 0 10px;font-size:15px;color:var(--muted)}
#rankList{list-style:none;margin:0;padding:0;overflow-y:auto;min-height:0;flex:1}
#rankList li{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:10px;padding:9px 6px;border-top:2px dashed #e3d6c6}
#rankList li.me{background:#fff1c2;border-radius:10px}
#rankList .rk{font-family:var(--px);font-size:12px;text-align:center}
#rankList .nm{font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rankList .nm small{display:block;font-size:13px;color:#7a6a5a}
#rankList b{font-family:var(--px);font-size:12px;font-weight:400}
@media (prefers-reduced-motion:reduce){.nick.warn,.mock .mockbig{animation:none}}
#hud{display:none!important}
#stage{margin-top:106px}
body{background:#3a2f45!important}
.overlay{padding-top:112px!important;align-items:flex-start!important}
.overlay .card{gap:7px;padding:14px 16px}
#over .row,#myRank,#over .stats{display:none}
.cap{position:absolute;left:0;right:0;top:16px;z-index:30;text-align:center;padding:0 12px;font-family:"Noto Sans CJK KR Black",sans-serif;font-size:29px;line-height:1.2;color:#fff;pointer-events:none;
  text-shadow:3px 3px 0 #1c1614,-3px 3px 0 #1c1614,3px -3px 0 #1c1614,-3px -3px 0 #1c1614,0 3px 0 #1c1614,0 -3px 0 #1c1614,3px 0 0 #1c1614,-3px 0 0 #1c1614}
.cap em{font-style:normal;color:#ffd64a}
.cap:empty{display:none}
#finger{position:absolute;z-index:25;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(28,22,20,.75);pointer-events:none;display:none;left:290px;top:560px}
#endcard{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:0 20px;background:radial-gradient(circle at 50% 32%,#fff6ee 0%,#f7e1c4 50%,#f07a8a 100%);color:#1c1614;font-family:"Noto Sans CJK KR Black",sans-serif}
#endcard canvas{width:150px;height:150px}
#endcard .t{font-size:48px;line-height:1.05;letter-spacing:-1px}
#endcard .t span{color:#e0453a}
#endcard .s{font-size:21px;color:#4b4360}
#endcard .u{font-family:"Noto Sans CJK KR",sans-serif;font-weight:700;font-size:18px;background:#1c1614;color:#fffaf0;padding:11px 20px;border-radius:999px}
#endcard .k{font-size:19px;line-height:1.35;color:#4b4360}
#endcard .k b{display:block;font-size:26px;color:#e0453a;margin-top:4px}
</style>

  <div id="endcard" hidden><canvas id="endFace" width="280" height="280"></canvas><div class="t">엄마 몰래<br><span>폰겜</span></div><div class="s">꾹 누르면 폰겜, 떼면 공부하는 척</div><div class="u">🔗 링크는 프로필에</div><div class="k">지금 바로 무료 플레이<b>엄마한테 안 걸릴 자신 있어요?</b></div></div>

<script>
(() => {
  const $ = id => document.getElementById(id);

  const INK = '#1c1614', KR = '"Noto Sans CJK KR Black", system-ui, sans-serif', PX = '"Noto Sans CJK KR Black", monospace';

  const SNITCH = {mom:['동생', '엄마~ 형 폰 해!!', '#e0453a'], teacher:['반장', '선생님! 쟤 폰 해요!', '#2fae7c'], boss:['김대리', '부장님~ 박대리 겜 해요', '#7a5cc9'], gf:['여친 친구', '얘 또 폰 본다~', '#f07aa8'], grandma:['바둑이', '멍멍!! 멍!!', 'dog']};

  function newRun(){ stage = 0; lives = 3; score = 0; safes = 0; hud(); showIntro(); }
  function showIntro(){
    state = 'intro'; musicOn = false; holding = false;
    const a = A();
    $('inKick').textContent = a.boss ? `STAGE ${stage + 1} · BOSS` : `STAGE ${stage + 1} · ${a.place}`;
    $('inName').textContent = a.name; $('inSay').textContent = a.intro;
    $('inRule').textContent = stage === 0 ? '꾹 누르면 폰겜, 떼면 공부하는 척. 게이지를 다 채우면 클리어!' : `눈치 속도 ${'★'.repeat(stage + 1)}${'☆'.repeat(4 - stage)} · 페이크 주의`;
    $('intro').hidden = false; $('goBtn').focus(); hud();
  }
  function startStage(){
    $('intro').hidden = true; ensureAudio();
    progress = 0; streak = 0; texts = []; bubble = null; state = 'play'; musicOn = true; step = 0;
    nextAway(); say(A().intro, 1800); evNext = now + 4500; snitch = null; notif = null; adUntil = 0; forceReal = false;
  }
  function caught(){
    const a = A(); lives--; streak = 0; smackAt = now; shake = 1.3; setPhase('caught', 1.6); sfx('smack');
    floatText(pick(a.caught), 300, '#e0453a', 32, 1500); say('딱 걸렸어!!', 1500); hud();
  }
  function afterCaught(){ if (lives <= 0) return gameOver(); holding = false; snitch = null; notif = null; adUntil = 0; forceReal = false; evNext = now + 3500; nextAway(); }
  function stageClear(){
    state = 'clear'; musicOn = false; sfx('clear'); const bonus = 500 * (stage + 1); score += bonus; hud();
    floatText(`STAGE CLEAR +${bonus}`, 300, '#2fae7c', 30, 1500);
    setTimeout(() => { if (stage === WATCH.length - 1) return allClear(); stage++; showIntro(); }, 1500);
  }
  function finish(){ const nb = score > best; if (nb){ best = Math.floor(score); store.set('md-best', best); } return nb; }
  function gameOver(){
    state = 'over'; musicOn = false; setTimeout(() => sfx('over'), 200);
    const a = A(); $('goBig').textContent = a.over[0]; $('goSub').textContent = a.over[1];
    $('goScore').textContent = Math.floor(score).toLocaleString(); $('goStage').textContent = `${a.name}`; $('goSafe').textContent = safes;
    const nb = finish(); $('goBest').textContent = best.toLocaleString(); $('goNew').hidden = !nb;
    shareText = `엄마 몰래 폰겜 ${a.name}한테 걸림 ㅋㅋ ${Math.floor(score).toLocaleString()}점. 너는 엄마한테 바로 걸릴 듯 ㅋ`;
    $('over').hidden = false; $('againBtn').focus(); submitScore(Math.floor(score), stage + 1, $('myRank'));
  }
  function allClear(){
    state = 'won'; $('wScore').textContent = Math.floor(score).toLocaleString(); const nb = finish(); $('wNew').hidden = !nb;
    shareText = `엄마 몰래 폰겜 할머니까지 속임 ㅋㅋ ${Math.floor(score).toLocaleString()}점. 눈치 만렙 인증`;
    $('win').hidden = false; $('againBtn2').focus(); submitScore(Math.floor(score), 6, $('myRank2'));
  }

  // ================= update =================
  function update(dt){
    if (state !== 'play') return;
    const a = A();
    if (phase === 'away' && now >= phaseEnd){ setPhase('warn', forceReal ? .38 : a.warn * rnd(.85, 1.15)); fakeNext = !forceReal && Math.random() < a.fake; forceReal = false; warnAt = now; sfx('warn'); say(a.peek, a.warn * 1000); }
    else if (phase === 'warn' && now >= phaseEnd){
      if (fakeNext){ say(a.fakeLine, 1100); if (!holding && now - releasedAt < 1200) floatText(pick(TOO_EARLY), 250, '#7a5cc9', 22, 900); nextAway(); }
      else {
        setPhase('look', rnd(...a.look)); sfx('look');
        if (holding) caught();
        else if (now - releasedAt < 260){ safes++; const b = 200 + stage * 50; score += b; sfx('safe'); floatText(`${pick(SAFE)} +${b}`, 250, '#2fae7c', 24, 900); }
      }
    }
    else if (phase === 'look'){
      if (holding){ caught(); }
      else if (now >= phaseEnd){
        if (Math.random() < a.double){ setPhase('warn', a.warn * .6); fakeNext = false; sfx('warn'); say('…한 번 더 볼까?', 700); }
        else nextAway();
      }
    }
    else if (phase === 'caught' && now >= phaseEnd) afterCaught();
    // interference: a KakaoTalk ping, a snitch, or an unskippable ad on the phone
    if (phase === 'away' && now >= evNext && progress > .08){
      evNext = now + rnd(4.2, 7) * 1000 - stage * 350;
      const r = Math.random();
      if (r < .38 && holding){ notif = {at: now}; sfx('kakao'); floatText('카톡! 🔔 소리 켜져 있음!!', 296, '#c9322a', 22, 1000); setPhase('warn', .42); fakeNext = false; say('무슨 소리야?', 600); }
      else if (r < .72){ const sn = SNITCH[a.id]; snitch = {at: now, name: sn[0], line: sn[1], col: sn[2]}; sfx('snitch'); forceReal = true; phaseEnd = now + 900; }
      else { adUntil = now + 1800; sfx('ad'); floatText('광고 나옴… 진행 멈춤 ㅋ', 296, '#7a5cc9', 20, 1100); }
    }
    if (snitch && now - snitch.at > 2200) snitch = null;
    if (holding && (phase === 'away' || phase === 'warn')){
      streak += dt; const rate = 100 * (1 + stage * .25) * (1 + Math.min(2, streak * .25));
      const ad = now < adUntil; score += rate * dt * (ad ? .2 : 1); if (!ad){ progress += dt / a.need; lv += dt * .6; }
      if ((phoneTick += dt) > .12){ phoneTick = 0; sfx('phone'); }
      if (progress >= 1){ progress = 1; holding = false; return stageClear(); }
    } else streak = 0;
    hud();
  }

  // ================= draw =================
  function draw(){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.fillStyle = '#f3e6d6'; ctx.fillRect(0, 0, W, H);
    const sh = shake > 0 ? (Math.random() - .5) * 12 * shake : 0; shake = Math.max(0, shake - .05);
    ctx.setTransform(dpr * S, 0, 0, dpr * S, dpr * (OX + sh), dpr * OY);
    const c = ctx, t = now, a = A();
    drawRoom(c, a.id, t);
    const pose = phase === 'caught' ? 'angry' : phase === 'look' ? 'front' : phase === 'warn' ? 'peek' : 'back';
    if (state !== 'title') drawWatcher(c, a.id, state === 'play' || state === 'clear' ? pose : 'back', 180, 190 + (a.id === 'grandma' ? 14 : 0), t, 1.15);
    // watcher's eye beam while looking
    if (phase === 'look' && state === 'play'){ c.fillStyle = 'rgba(255,80,60,.10)'; c.beginPath(); c.moveTo(150, 190); c.lineTo(20, 600); c.lineTo(340, 600); c.lineTo(210, 190); c.closePath(); c.fill(); }
    // the floor
    c.fillStyle = '#d9b98f'; c.fillRect(0, 330, DW, 270);
    c.fillStyle = 'rgba(0,0,0,.05)'; for (let y = 340; y < 600; y += 22) c.fillRect(0, y, DW, 2);
    drawPlayer(c, holding && state === 'play', phase === 'caught' && state === 'play', t);
    // the snitch pops in from the left
    if (snitch && state === 'play'){
      const k = Math.min(1, (now - snitch.at) / 200), x = -40 + k * 100, y = 470;
      c.save(); c.translate(x, y);
      if (snitch.col === 'dog'){ ell(c, 0, 20, 24, 18, 0, '#c98a4a', 3); ell(c, 0, -6, 20, 18, 0, '#c98a4a', 3); ell(c, -16, -10, 7, 14, .4, '#7a4b2a', 2.5); ell(c, 16, -10, 7, 14, -.4, '#7a4b2a', 2.5); ell(c, -7, -8, 2.5, 3, 0, INK); ell(c, 7, -8, 2.5, 3, 0, INK); ell(c, 0, 2, 4, 3, 0, INK); c.beginPath(); c.ellipse(0, 9, 5, 4 + Math.abs(Math.sin(now / 80)) * 3, 0, 0, 7); c.fillStyle = '#7a2e2e'; c.fill(); }
      else { c.fillStyle = snitch.col; c.strokeStyle = INK; c.lineWidth = 3; c.beginPath(); c.moveTo(-24, 50); c.quadraticCurveTo(-26, 10, 0, 8); c.quadraticCurveTo(26, 10, 24, 50); c.closePath(); c.fill(); c.stroke();
        ell(c, 0, -12, 20, 20, 0, '#f2c79b', 3); c.fillStyle = '#3b2a20'; c.beginPath(); c.arc(0, -16, 20, Math.PI, 0); c.fill();
        ell(c, -7, -10, 2.5, 3, 0, INK); ell(c, 7, -10, 2.5, 3, 0, INK); c.beginPath(); c.ellipse(0, 0, 5, 4 + Math.abs(Math.sin(now / 90)) * 2, 0, 0, 7); c.fillStyle = '#7a2e2e'; c.fill();
        c.strokeStyle = INK; c.lineWidth = 4; c.beginPath(); c.moveTo(18, 20); c.lineTo(40, 4 + Math.sin(now / 70) * 4); c.stroke(); }
      c.restore();
      c.font = `16px ${KR}`; const tw = c.measureText(snitch.line).width + 20; c.fillStyle = '#fff'; c.strokeStyle = INK; c.lineWidth = 2.5; rr(c, 8, 384, tw, 28, 12); c.fill(); c.stroke();
      c.fillStyle = INK; c.textAlign = 'left'; c.fillText(snitch.line, 18, 404);
      c.fillStyle = '#e0453a'; c.font = `13px ${KR}`; c.fillText(`고자질쟁이 ${snitch.name}`, 10, 378);
    }
    // KakaoTalk ping ring around the phone
    if (notif && now - notif.at < 700){ const k = (now - notif.at) / 700; c.strokeStyle = `rgba(255,214,0,${1 - k})`; c.lineWidth = 5; c.beginPath(); c.arc(180, 520, 60 + k * 80, 0, 7); c.stroke(); }
    // the smack
    const sk = (now - smackAt) / 600;
    if (sk >= 0 && sk < 1){
      c.save(); c.translate(260 - sk * 40, 430 + Math.sin(sk * Math.PI) * -30); c.rotate(-.6 + sk * .8);
      c.fillStyle = '#f2c79b'; c.strokeStyle = INK; c.lineWidth = 3.5; rr(c, -30, -20, 60, 46, 18); c.fill(); c.stroke();
      for (let i = 0; i < 4; i++){ rr(c, -26 + i * 14, -46 + Math.abs(i - 1.5) * 4, 12, 30, 6); c.fill(); c.stroke(); }
      c.restore();
      c.fillStyle = '#fff'; c.font = `40px ${KR}`; c.textAlign = 'center'; c.lineWidth = 7; c.strokeStyle = INK; c.strokeText('짝!', 250, 420); c.fillText('짝!', 250, 420);
    }
    // progress bar
    if (state === 'play' || state === 'clear'){
      c.fillStyle = 'rgba(28,22,20,.75)'; rr(c, 20, 342, 320, 26, 13); c.fill();
      c.fillStyle = '#ffd64a'; rr(c, 24, 346, Math.max(14, 312 * progress), 18, 9); c.fill();
      c.fillStyle = '#fff'; c.font = `14px ${KR}`; c.textAlign = 'center'; c.fillText(progress < .03 && !holding ? '꾹 누르면 폰겜 시작' : `폰겜 진행도 ${Math.floor(progress * 100)}%`, 180, 360);
    }
    // bubble from the watcher
    if (bubble && now < bubble.until && state !== 'title'){
      let fs = 18; c.font = `${fs}px ${KR}`; if (c.measureText(bubble.text).width > 312){ fs = 15; c.font = `${fs}px ${KR}`; }
      const w = Math.min(340, c.measureText(bubble.text).width + 24), bx = Math.max(10, Math.min(350 - w, 230 - w / 2));
      c.fillStyle = '#fff'; c.strokeStyle = INK; c.lineWidth = 2.5; rr(c, bx, 40, w, 32, 14); c.fill(); c.stroke();
      c.fillStyle = INK; c.textAlign = 'center'; c.fillText(bubble.text, bx + w / 2, 62);
    }
    // warning marks
    if (phase === 'warn' && state === 'play'){ c.fillStyle = '#e0453a'; c.font = `38px ${KR}`; c.textAlign = 'center'; c.lineWidth = 6; c.strokeStyle = '#fff'; c.strokeText('!', 120, 120); c.fillText('!', 120, 120); }

    texts = texts.filter(x => now - x.at < x.ms);
    for (const x of texts){ const k = (now - x.at) / x.ms; c.save(); c.globalAlpha = 1 - Math.max(0, k - .7) / .3; c.font = `${x.size}px ${KR}`; c.textAlign = 'center'; c.lineJoin = 'round'; c.lineWidth = 6; c.strokeStyle = '#fff'; c.strokeText(x.text, 180, x.y - k * 18); c.fillStyle = x.color; c.fillText(x.text, 180, x.y - k * 18); c.restore(); }
  }
  function face(id, wid, pose){
    const c = $(id).getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, 280, 280);
    c.fillStyle = '#f6eee4'; c.beginPath(); c.arc(140, 140, 130, 0, 7); c.fill(); c.save(); c.beginPath(); c.arc(140, 140, 130, 0, 7); c.clip();
    drawWatcher(c, wid, pose, 140, 130, now, 1.6); c.restore();
    if (pose === 'angry'){ c.font = `34px ${KR}`; c.fillStyle = '#e0453a'; c.textAlign = 'center'; c.fillText('딱 걸렸어!', 140, 268); }
  }
  function loop(){
    now = performance.now(); const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); draw();
    if (!$('start').hidden) face('stFace', 'mom', (now % 3000) < 2000 ? 'back' : 'front');
    if (!$('intro').hidden) face('inFace', A().id, 'front');
    if (!$('over').hidden) face('goFace', A().id, 'angry');
    if (!$('win').hidden) face('wFace', 'grandma', 'peek');
    requestAnimationFrame(loop);
  }

  // ================= input: hold to play =================
  const pts = new Set();
  function press(on){
    if (state !== 'play' || phase === 'caught'){ holding = false; return; }
    if (on && !holding){ holding = true; if (phase === 'look') caught(); }
    else if (!on && holding){ holding = false; releasedAt = now; }
  }
  cv.addEventListener('pointerdown', e => { e.preventDefault(); pts.add(e.pointerId); press(true); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(tp => cv.addEventListener(tp, e => { pts.delete(e.pointerId); if (!pts.size) press(false); }));
  addEventListener('keydown', e => { if (e.target.tagName === 'INPUT' || e.repeat) return; if (e.key === ' '){ e.preventDefault(); press(true); } });
  addEventListener('keyup', e => { if (e.key === ' ') press(false); });

  // ================= nickname & buttons =================
  let nick = ''; try { nick = localStorage.getItem('spacexxx-nick') || ''; } catch(e){}
  const nickEl = $('nick'); nickEl.value = nick;
  nickEl.addEventListener('input', () => { nick = nickEl.value.replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim().slice(0, 12); try { localStorage.setItem('spacexxx-nick', nick); } catch(e){} if (nick){ $('nickWarn').textContent = ''; nickEl.parentElement.classList.remove('warn'); } });
  nickEl.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); $('startBtn').click(); } });
  function requireNick(){ if (nick) return true; const b = nickEl.parentElement; b.classList.remove('warn'); void b.offsetWidth; b.classList.add('warn'); $('nickWarn').textContent = '닉네임을 입력하세요'; nickEl.focus(); return false; }
  $('startBtn').addEventListener('click', () => { if (!requireNick()) return; ensureAudio(); $('start').hidden = true; newRun(); logPlay(); });
  $('goBtn').addEventListener('click', startStage);
  const again = () => { $('over').hidden = true; $('win').hidden = true; $('myRank').textContent = ''; $('myRank2').textContent = ''; ensureAudio(); newRun(); logPlay(); };
  $('againBtn').addEventListener('click', again); $('againBtn2').addEventListener('click', again);

  // ================= leaderboard =================
  // Fill these in to turn on worldwide ranking. Left empty, rankings stay on this device.
  const LEADERBOARD = { projectId: '', apiKey: '' };
  const COLLECTION = 'mom_scores', REMOTE = !!(LEADERBOARD.projectId && LEADERBOARD.apiKey), LB_LIMIT = 100;
  let submittedBest = store.get('md-submitted', 0), shareText = '';
  const playerName = () => nick || '익명';
  const fsBase = () => `https://firestore.googleapis.com/v1/projects/${encodeURIComponent(LEADERBOARD.projectId)}/databases/(default)/documents`;
  function logPlay(){ if (!REMOTE) return; try { fetch(`${fsBase()}/plays?key=${LEADERBOARD.apiKey}`, {method:'POST', headers:{'Content-Type':'application/json'}, keepalive:true, body: JSON.stringify({fields:{game:{stringValue:'mom'}, ts:{timestampValue:new Date().toISOString()}}})}).catch(() => {}); } catch(e){} }
  async function fsPost(url, body){ const ctrl = new AbortController(), tm = setTimeout(() => ctrl.abort(), 7000); try { const r = await fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body), signal: ctrl.signal}); if (!r.ok) throw new Error(r.status); return await r.json(); } finally { clearTimeout(tm); } }
  async function loadBoard(){
    if (!REMOTE) return {board: store.get('md-board', []).sort((a, b) => b.score - a.score).slice(0, LB_LIMIT), remote:false};
    const rows = await fsPost(`${fsBase()}:runQuery?key=${encodeURIComponent(LEADERBOARD.apiKey)}`, {structuredQuery:{from:[{collectionId: COLLECTION}], orderBy:[{field:{fieldPath:'score'}, direction:'DESCENDING'}], limit: LB_LIMIT}});
    return {remote:true, board: rows.filter(r => r.document).map(r => { const f = r.document.fields || {}; return {name: String((f.name && f.name.stringValue) || '?').slice(0, 12), score: +((f.score && f.score.integerValue) || 0), stage: +((f.stage && f.stage.integerValue) || 0)}; })};
  }
  async function saveEntry(e){
    if (!REMOTE){ const b = store.get('md-board', []); b.push(e); b.sort((a, c) => c.score - a.score); store.set('md-board', b.slice(0, LB_LIMIT)); return; }
    await fsPost(`${fsBase()}/${COLLECTION}?key=${encodeURIComponent(LEADERBOARD.apiKey)}`, {fields:{name:{stringValue: e.name}, score:{integerValue: String(e.score)}, stage:{integerValue: String(e.stage)}, ts:{timestampValue: new Date().toISOString()}}});
  }
  async function submitScore(sc, st, el){
    el.textContent = '순위 확인 중…';
    try { if (sc > 0 && sc > submittedBest){ await saveEntry({name: playerName(), score: sc, stage: st}); submittedBest = sc; store.set('md-submitted', sc); }
      const {board: b, remote} = await loadBoard(), above = b.filter(r => r.score > sc).length;
      el.textContent = `${playerName()} · ${remote ? '전체' : '이 기기'} ${above + 1}위`;
    } catch(err){ el.textContent = '순위 서버에 연결하지 못했어요'; }
  }
  const stageName = s => s > 5 ? '올클리어' : `${WATCH[s - 1].name}한테 걸림`;
  const rankPanel = $('rankPanel');
  async function openRank(){
    rankPanel.hidden = false; $('rankClose').focus(); const list = $('rankList'), note = $('rankNote'); list.textContent = ''; note.textContent = '불러오는 중…';
    try { const {board: b, remote} = await loadBoard(); note.textContent = remote ? '전체 TOP 30' : '온라인 순위가 아직 연결되지 않아 이 기기 기록만 보여요'; if (!b.length) note.textContent += ' · 아직 기록이 없어요';
      const me = playerName();
      b.slice(0, 30).forEach((r, i) => { const li = document.createElement('li'); if (r.name === me) li.className = 'me';
        const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = i + 1;
        const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.name; const m = document.createElement('small'); m.textContent = r.stage ? stageName(r.stage) : ''; nm.appendChild(m);
        const sc = document.createElement('b'); sc.textContent = r.score.toLocaleString(); li.append(rk, nm, sc); list.appendChild(li); });
    } catch(err){ note.textContent = '순위를 불러오지 못했어요'; }
  }
  ['rankBtn', 'rankBtn2', 'rankBtn3'].forEach(id => $(id).addEventListener('click', openRank));
  $('rankClose').addEventListener('click', () => { rankPanel.hidden = true; });
  rankPanel.addEventListener('pointerdown', e => { if (e.target === rankPanel) rankPanel.hidden = true; });
  async function share(el){
    const text = `${shareText} — ${playerName()}\n${location.href.split('#')[0]}`;
    try { if (navigator.share){ await navigator.share({title:'엄마 몰래 폰겜', text}); return; } } catch(err){ if (err && err.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(text); el.textContent = '복사했어요'; } catch(err){ el.textContent = text; }
  }
  $('shareBtn').addEventListener('click', () => share($('myRank'))); $('shareBtn2').addEventListener('click', () => share($('myRank2')));

  window.__M = {ev: c => eval(c)};
  hud(); requestAnimationFrame(loop);
})();
</script>
</body></html>
